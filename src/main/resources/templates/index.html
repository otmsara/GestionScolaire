<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Accueil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .welcome-container {
            background-color: #ffffff;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .welcome-container h1 {
            font-weight: 700;
            color: #343a40;
        }
        .btn-custom {
            min-width: 200px;
            font-size: 1.1rem;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
        .btn-secondary {
            background-color: #6c757d;
            border: none;
        }
        .btn-success {
            background-color: #198754;
            border: none;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Gestion Scolaire</a>
    </div>
</nav>

<div class="container mt-5 d-flex justify-content-center">
    <div class="welcome-container text-center">
        <h1 class="mb-4">Bienvenue</h1>

        <a href="/eleves" class="btn btn-primary btn-lg m-2 btn-custom">Gestion des Eleves</a>
        <a href="/filieres" class="btn btn-secondary btn-lg m-2 btn-custom">Gestion des Filieres</a>
        <a href="/cours" class="btn btn-success btn-lg m-2 btn-custom">Gestion des Cours</a>
    </div>
</div>

</body>
</html>
