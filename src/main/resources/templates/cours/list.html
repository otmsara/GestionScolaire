<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des cours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        h2 {
            margin-bottom: 1.5rem;
            color: #343a40;
        }

        .table thead {
            background-color: #e9ecef;
        }

        .table-hover tbody tr:hover {
            background-color: #f1f3f5;
        }

        .btn + .btn {
            margin-left: 0.5rem;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <h2>Liste des cours</h2>

    <a th:href="@{/cours/new}" class="btn btn-primary mb-3">
        Ajouter un cours
    </a>

    <table class="table table-bordered table-hover align-middle">
        <thead>
        <tr>
            <th>Code</th>
            <th>Intitulé</th>
            <th>Filière</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${cours}">
            <td th:text="${c.code}"></td>
            <td th:text="${c.intitule}"></td>
            <td th:text="${c.filiere != null ? c.filiere.nom : '—'}"></td>
            <td class="actions">
                <a th:href="@{/cours/edit/{id}(id=${c.id})}"
                   class="btn btn-warning btn-sm">
                    Modifier
                </a>
                <a th:href="@{/cours/delete/{id}(id=${c.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Supprimer ce cours ?')">
                    Supprimer
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
