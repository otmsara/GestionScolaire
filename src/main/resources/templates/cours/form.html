<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter / Modifier Cours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Formulaire Cours</h3>
        </div>
        <div class="card-body">

            <form th:action="@{/cours/save}" th:object="${cours}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label fw-semibold">Code</label>
                    <input type="text" th:field="*{code}" class="form-control" placeholder="Ex: INF101" />
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Intitulé</label>
                    <input type="text" th:field="*{intitule}" class="form-control" placeholder="Ex: Introduction à l'informatique" />
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Filière</label>
                    <select th:field="*{filiere}" class="form-select">
                        <option value="">-- Choisir une filière --</option>
                        <option th:each="f : ${filieres}"
                                th:value="${f.id}"
                                th:text="${f.nom}">
                        </option>
                    </select>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-success">Enregistrer</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
