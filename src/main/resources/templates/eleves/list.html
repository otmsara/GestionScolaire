<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des élèves</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Liste des élèves</h2>

    <a th:href="@{/eleves/new}" class="btn btn-primary mb-3">
        Ajouter Élève
    </a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Filière</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${eleves}">
            <td th:text="${e.nom}"></td>
            <td th:text="${e.prenom}"></td>
            <td th:text="${e.filiere != null ? e.filiere.nom : '—'}"></td>
            <td>
                <a th:href="@{/eleves/edit/{id}(id=${e.id})}"
                   class="btn btn-warning btn-sm">Modifier</a>

                <a th:href="@{/eleves/delete/{id}(id=${e.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Supprimer cet élève ?')">
                    Supprimer
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
