<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails Élève</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            margin-top: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        .card-body p {
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .back-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card mx-auto col-md-6">
        <div class="card-header">
            Détails Élève
        </div>

        <div class="card-body">
            <p><strong>Nom :</strong> <span th:text="${eleve.nom}"></span></p>
            <p><strong>Prénom :</strong> <span th:text="${eleve.prenom}"></span></p>

            <p>
                <strong>Filière :</strong>
                <span th:text="${eleve.filiere != null ? eleve.filiere.nom : '—'}"></span>
            </p>

            <hr>

            <p><strong>Dossier Administratif :</strong></p>

            <ul>
                <li>
                    Numéro d'inscription :
                    <span th:text="${eleve.filiere != null
                        && eleve.dossierAdministratif != null
                        && eleve.dossierAdministratif.dateCreation != null
                        ?
                        eleve.filiere.nom.toUpperCase()
                        + '-' +
                        #temporals.format(eleve.dossierAdministratif.dateCreation, 'yyyy')
                        + '-' +
                        eleve.id
                        : '—'}">
                    </span>
                </li>

                <li>
                    Date de création :
                    <span th:text="${eleve.dossierAdministratif != null
                        && eleve.dossierAdministratif.dateCreation != null
                        ?
                        #temporals.format(eleve.dossierAdministratif.dateCreation, 'dd/MM/yyyy')
                        : '—'}">
                    </span>
                </li>
            </ul>

            <a th:href="@{/eleves}" class="btn btn-secondary back-btn">
                <i class="bi bi-arrow-left-circle"></i> Retour à la liste
            </a>
        </div>
    </div>
</div>

</body>
</html>
