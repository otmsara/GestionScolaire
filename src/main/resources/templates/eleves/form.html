<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Élève</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 th:text="${eleve.id == null ? 'Ajouter un élève' : 'Modifier un élève'}"></h2>

    <form th:action="@{/eleves/save}" th:object="${eleve}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <!-- NOM -->
        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" th:field="*{nom}" class="form-control"/>
            <div class="text-danger"
                 th:if="${#fields.hasErrors('nom')}"
                 th:errors="*{nom}">
            </div>
        </div>

        <!-- PRENOM -->
        <div class="mb-3">
            <label class="form-label">Prénom</label>
            <input type="text" th:field="*{prenom}" class="form-control"/>
            <div class="text-danger"
                 th:if="${#fields.hasErrors('prenom')}"
                 th:errors="*{prenom}">
            </div>
        </div>

        <!-- FILIERE -->
        <div class="mb-3">
            <label class="form-label">Filière</label>
            <select th:field="*{filiere}" class="form-select">
                <option value="">-- Sélectionner --</option>
                <option th:each="f : ${filieres}"
                        th:value="${f}"
                        th:text="${f.nom}">
                </option>
            </select>
        </div>

        <!-- COURS -->
        <div class="mb-3">
            <label class="form-label">Cours suivis</label>
            <select th:field="*{cours}" multiple class="form-select">
                <option th:each="c : ${cours}"
                        th:value="${c}"
                        th:text="${c.intitule}">
                </option>
            </select>
        </div>

        <!-- ACTIONS -->
        <button type="submit" class="btn btn-success">
            Enregistrer
        </button>
        <a th:href="@{/eleves}" class="btn btn-secondary">
            Annuler
        </a>

    </form>

</div>

</body>
</html>
