<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Élève</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0" th:text="${eleve.id == null ? 'Ajouter un élève' : 'Modifier un élève'}"></h3>
        </div>
        <div class="card-body">

            <form th:action="@{/eleves/save}" th:object="${eleve}" method="post">

                <input type="hidden" th:field="*{id}"/>

                <!-- NOM -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nom</label>
                    <input type="text" th:field="*{nom}" class="form-control" placeholder="Entrez le nom"/>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>

                <!-- PRENOM -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Prénom</label>
                    <input type="text" th:field="*{prenom}" class="form-control" placeholder="Entrez le prénom"/>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
                </div>

                <!-- FILIERE -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Filière</label>
                    <select th:field="*{filiere.id}" class="form-select">
                        <option value="">-- Sélectionner --</option>
                        <option th:each="f : ${filieres}" th:value="${f.id}" th:text="${f.nom}"></option>
                    </select>
                </div>

                <!-- COURS -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Cours suivis</label>
                    <select th:field="*{cours}" multiple class="form-select">
                        <option th:each="c : ${cours}" th:value="${c.id}" th:text="${c.intitule}"></option>
                    </select>
                </div>

                <!-- SUBMITION -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/eleves}" class="btn btn-outline-secondary">Annuler</a>
                    <button type="submit" class="btn btn-success">Enregistrer</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
