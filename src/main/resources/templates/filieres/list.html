<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des filières</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h2 {
            margin-bottom: 20px;
            color: #343a40;
        }
        .btn-space {
            margin-right: 5px;
        }
        .table-hover tbody tr:hover {
            background-color: #e9ecef;
        }
        .table thead th {
            vertical-align: middle;
            text-align: center;
        }
        .table tbody td {
            vertical-align: middle;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Liste des filières</h2>
        <a th:href="@{/filieres/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Ajouter Filière
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Code</th>
                <th>Nom</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${filieres}">
                <td th:text="${f.code}"></td>
                <td th:text="${f.nom}"></td>
                <td>
                    <a th:href="@{/filieres/edit/{id}(id=${f.id})}" class="btn btn-warning btn-sm btn-space">
                        Modifier
                    </a>
                    <a th:href="@{/filieres/delete/{id}(id=${f.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Supprimer cette filière ?')">
                        Supprimer
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- Optionnel : Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

</body>
</html>
