<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${filiere.id == null ? 'Ajouter une filière' : 'Modifier une filière'}">Formulaire Filière</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0" th:text="${filiere.id == null ? 'Ajouter une filière' : 'Modifier une filière'}"></h3>
        </div>
        <div class="card-body">

            <form th:action="@{/filieres/save}" th:object="${filiere}" method="post">

                <input type="hidden" th:field="*{id}" />

                <!-- CODE -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Code</label>
                    <input type="text" th:field="*{code}" class="form-control form-control-lg" placeholder="Entrez le code"/>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                </div>

                <!-- NOM -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nom</label>
                    <input type="text" th:field="*{nom}" class="form-control form-control-lg" placeholder="Entrez le nom"/>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>

                <!-- ACTIONS -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/filieres}" class="btn btn-outline-secondary">Annuler</a>
                    <button type="submit" class="btn btn-success">Enregistrer</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
